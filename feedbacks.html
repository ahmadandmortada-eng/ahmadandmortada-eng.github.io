<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Feedbacks | Resemblance</title>
<meta name="description" content="Customer feedbacks and reviews for Resemblance: gift cards, TikTok and Instagram usernames and digital products.">
<link rel="canonical" href="https://rassim.shop/feedbacks">
<link rel="icon" href="/pfp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">
</head>
<body>
<main class="wrap narrow">
  <nav id="nav"></nav>
  <h1>Feedbacks</h1>
  <p class="sub" id="sub">What our customers say</p>
  <p id="state" class="empty">Loading...</p>
  <div class="panel" id="list" hidden></div>
  <div id="foot"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/theme.js"></script>
<script src="/shop.js"></script>
<script>if (typeof Shop === 'undefined') addEventListener('DOMContentLoaded', () => { const e = document.getElementById('state'); if (e) e.textContent = 'Error: shop.js did not load. Upload shop.js next to index.html on GitHub.'; });</script>
<script>
  const $ = id => document.getElementById(id), { h } = Shop;
  (async () => {
    if (!Shop.needClient($('state'))) return;
    const { data, error } = await sb.from('feedbacks_public').select('*').order('created_at', { ascending: false }).limit(200);
    if (error) { $('state').textContent = 'Could not load feedbacks: ' + error.message; return; }
    if (!data.length) { $('state').textContent = 'No feedbacks yet.'; return; }
    const avg = data.reduce((a, r) => a + r.rating, 0) / data.length;
    $('sub').replaceChildren(h('span', { class: 'stars' }, Shop.stars(Math.round(avg))), ' ' + avg.toFixed(1) + ' / 5 from ' + data.length + ' feedback' + (data.length > 1 ? 's' : ''));
    $('state').hidden = true; $('list').hidden = false;
    $('list').replaceChildren(...data.map(r => h('div', { class: 'rev' },
      h('div', { class: 'who' }, h('b', {}, r.author, r.verified ? h('span', { class: 'vpill' }, 'Verified purchase') : null), h('span', { class: 'stars' }, Shop.stars(r.rating))),
      h('p', {}, r.comment),
      h('p', { class: 'c', style: 'color:var(--muted);font-style:italic;font-size:.95rem' }, [r.product_title, Shop.dt(r.created_at)].filter(Boolean).join(' | ')))));
  })().catch(e => { $('state').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
