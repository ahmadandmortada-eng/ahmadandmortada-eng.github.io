<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 | Resemblanced</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/pfp.png">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script>
  /* a path like /ali might be a customer profile: keep the page hidden until we know */
  if (/^\/@?[A-Za-z0-9_]{3,20}\/?$/.test(location.pathname)) {
    document.documentElement.classList.add('probe');
    setTimeout(() => document.documentElement.classList.remove('probe'), 4000);
  }
</script>
<style>
  html.probe main { visibility:hidden; }
  :root {
    --accent: hsl(0 0% 82%);
    --glow: hsl(0 0% 82% / .5);
    --bg-center: hsl(0 0% 9%);
    --bg-edge: #050505;
    --text:#ece7e7; --muted:#9a9090;
  }
  * { box-sizing:border-box; margin:0; }
  html { height:100%; background:var(--bg-edge); -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  body {
    min-height:100%; min-height:100dvh;
    background: radial-gradient(ellipse at 50% 35%, var(--bg-center) 0%, var(--bg-edge) 70%) fixed;
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:max(24px,env(safe-area-inset-top,0px)) 24px max(24px,env(safe-area-inset-bottom,0px));
    overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  main { position:relative; z-index:1; width:100%; max-width:380px; margin:auto; }

  .pfp {
    width:clamp(108px,32vw,148px); height:clamp(108px,32vw,148px); border-radius:50%; object-fit:cover;
    background:#111; display:block; margin:0 auto 22px;
    border:2px solid var(--accent);
    box-shadow: 0 0 0 6px var(--bg-edge), 0 0 0 7px var(--accent), 0 0 40px var(--glow);
    animation: pulse 5s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--bg-edge), 0 0 0 7px var(--accent), 0 0 75px var(--glow); } }

  h1 { font-family:"UnifrakturCook","Times New Roman",serif; font-size:clamp(2.6rem,12vw,3.4rem); font-weight:700; letter-spacing:.02em; text-shadow:0 0 22px var(--glow); }
  .bio { font-size:clamp(1rem,4vw,1.15rem); line-height:1.7; font-style:normal; color:var(--muted); margin:8px 0 30px; line-height:1.5; }

  .ret {
    display:inline-block; min-width:130px; padding:14px 30px; border-radius:999px;
    color:var(--text); font-size:1.2rem; font-style:normal; text-decoration:none;
    border:1px solid color-mix(in srgb, var(--accent) 35%, #222);
    background:rgba(0,0,0,.55);
    transition: color .2s, border-color .2s, box-shadow .2s, transform .2s;
  }
  .ret:hover { color:#fff; border-color:var(--accent); box-shadow:0 0 22px var(--glow); transform:translateY(-3px); }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }

  @media (max-height:560px) { .pfp { width:84px; height:84px; margin-bottom:12px; } .bio { margin-bottom:16px; } }
  @media (prefers-reduced-motion: reduce) { .pfp { animation:none; } .ret, body { transition:none; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<main>
  <img class="pfp" id="pfp" src="/pfp.png" alt="">
  <h1>404</h1>
  <p class="bio">Page not found</p>
  <a class="ret" href="/">Return</a>
</main>

<script>
  /* ---------- Color from the photo (same as the main page) ---------- */
  let hue = 0, sat = 0, lit = 82;
  const root = document.documentElement.style;

  function applyColor() {
    root.setProperty('--accent', `hsl(${hue} ${sat}% ${lit}%)`);
    root.setProperty('--glow', `hsl(${hue} ${sat}% ${lit}% / .5)`);
    root.setProperty('--bg-center', `hsl(${hue} ${Math.round(sat * .55)}% 11%)`);
    root.setProperty('--bg-edge', `hsl(${hue} ${Math.round(sat * .4)}% 3%)`);
    root.setProperty('--text', `hsl(${hue} 25% 92%)`);
    root.setProperty('--muted', `hsl(${hue} 12% 62%)`);
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.content = `hsl(${hue} ${Math.round(sat * .4)}% 3%)`;
  }

  function dominantColor(img) {
    const c = document.createElement('canvas');
    c.width = c.height = 40;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 40, 40);
    const d = ctx.getImageData(0, 0, 40, 40).data;
    const bins = Array.from({ length: 12 }, () => ({ w: 0, h: 0 }));
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i] / 255, g = d[i+1] / 255, b = d[i+2] / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, df = max - min;
      if (df < .12 || l < .12 || l > .9) continue;
      const s = df / (1 - Math.abs(2 * l - 1));
      let h = max === r ? ((g - b) / df) % 6 : max === g ? (b - r) / df + 2 : (r - g) / df + 4;
      h = (h * 60 + 360) % 360;
      const bin = bins[Math.floor(h / 30)];
      bin.w += s; bin.h += h * s;
    }
    const best = bins.reduce((a, b) => (b.w > a.w ? b : a));
    if (best.w === 0) return null;
    return Math.round(best.h / best.w);
  }

  const pfp = document.getElementById('pfp');
  function readPfp() {
    try { const h = dominantColor(pfp); if (h !== null) { hue = h; sat = 70; lit = 52; } else { sat = 0; lit = 82; } } catch (e) {}
    applyColor();
  }
  applyColor();
  pfp.complete ? readPfp() : pfp.addEventListener('load', readPfp);

  /* ---------- Embers ---------- */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const cv = document.getElementById('fx'), x = cv.getContext('2d');
    let W, H, parts = [];
    const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
    size(); addEventListener('resize', size);
    const mk = (init) => ({
      x: Math.random() * W, y: init ? Math.random() * H : H + 10,
      r: Math.random() * 1.8 + .5, v: Math.random() * .5 + .2,
      drift: Math.random() * .6 - .3, a: Math.random() * .6 + .2
    });
    for (let i = 0; i < (innerWidth < 600 ? 30 : 55); i++) parts.push(mk(true));
    (function loop() {
      x.clearRect(0, 0, W, H);
      const col = getComputedStyle(document.documentElement).getPropertyValue('--accent');
      parts.forEach((p, i) => {
        p.y -= p.v; p.x += p.drift;
        if (p.y < -10) parts[i] = mk(false);
        x.globalAlpha = p.a * (p.y / H);
        x.fillStyle = col;
        x.shadowColor = col; x.shadowBlur = 8;
        x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
      });
      requestAnimationFrame(loop);
    })();
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/shop.js"></script>
<script src="/profile-view.js"></script>
<script>
  /* rassim.shop/<username> shows that customer's profile; rassim.shop/user opens your own profile */
  (async () => {
    try {
      const seg = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, '');
      if (seg.toLowerCase() === 'user') return location.replace('/profile');
      if (typeof Shop === 'undefined' || !window.sbReady) return;
      const name = Shop.cleanUsername(seg);
      if (Shop.validUsername(name)) await ProfileView.render(document.querySelector('main'), name);
    } catch (e) { /* keep the normal 404 page */ }
    finally { document.documentElement.classList.remove('probe'); }
  })();
</script>
</body>
</html>
