<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/pfp.png">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">
<title>Browse | Resemblanced</title>
<meta name="description" content="Browse the Resemblance shop: usernames, gift cards and digital products.">
</head>
<body>
<main class="wrap">
  <div class="top"><a class="btn small" href="/">Return</a><a class="btn small" href="/account">Account</a></div>
  <h1>Browse</h1>
  <p class="sub">Usernames, gift cards &amp; digital products</p>
  <div class="chips" id="chips"></div>
  <p id="state" class="empty">Loading...</p>
  <div class="grid" id="grid"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/theme.js"></script>
<script src="/shop.js"></script>
<script>if (typeof Shop === 'undefined') addEventListener('DOMContentLoaded', () => { const e = document.getElementById('state') || document.getElementById('list') || document.getElementById('msg'); if (e) e.textContent = 'Error: shop.js did not load. Upload shop.js next to index.html on GitHub.'; });</script>
<script>
  const $ = id => document.getElementById(id), { h, fmt, LABEL } = Shop;
  const CHIPS = [['all', 'All'], ['tiktok_username', 'TikTok'], ['instagram_username', 'Instagram'], ['gift_card', 'Gift cards'], ['digital_product', 'Digital']];
  let products = [], filter = 'all';

  function render() {
    const list = products.filter(p => filter === 'all' || p.category === filter);
    $('chips').replaceChildren(...CHIPS.map(([k, t]) => h('button', { class: 'chip' + (k === filter ? ' on' : ''), onclick: () => { filter = k; render(); } }, t)));
    $('grid').replaceChildren(...list.map(p => h('article', { class: 'card' + (p.available <= 0 ? ' sold' : '') },
      h('img', { src: Shop.productImage(p), alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }),
      h('span', { class: 'tag' }, LABEL[p.category] || p.category),
      h('span', { class: 'name' }, p.title),
      p.description ? h('span', { class: 'meta' }, p.description) : null,
      h('span', { class: 'price' }, fmt(p.price_dzd)),
      p.available > 0 && p.available <= 5 ? h('span', { class: 'meta' }, p.available + ' left') : null,
      p.available <= 0 ? h('button', { class: 'btn', disabled: '' }, 'Sold out') : h('a', { class: 'btn', href: '/buy.html?p=' + encodeURIComponent(p.id), style: 'text-align:center' }, 'Buy'))));
    $('state').hidden = list.length > 0;
    if (!list.length) $('state').textContent = 'Nothing here yet.';
  }
  async function load() {
    if (!window.sbReady) { $('state').textContent = 'The shop is not connected: ' + (window.sbError || 'config.js did not load'); return; }
    const { data, error } = await sb.from('products_public').select('*').order('created_at', { ascending: false });
    if (error) { $('state').textContent = 'Could not load products: ' + error.message; return; }
    products = data; render();
  }
  load().catch(e => { $('state').hidden = false; $('state').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
