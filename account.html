<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/pfp.png">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">
<title>Account | Resemblanced</title>
<meta name="robots" content="noindex">
</head>
<body>
<main class="wrap narrow">
  <div class="top"><a class="btn small" href="/browse">Browse</a><button class="btn small" id="out" hidden>Logout</button></div>
  <h1>Account</h1>
  <p class="sub" id="who"></p>
  <h2>My orders</h2>
  <div class="panel" id="list"><p class="empty">Loading...</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/theme.js"></script>
<script src="/shop.js"></script>
<script>
  const $ = id => document.getElementById(id), { h, fmt } = Shop;
  const TXT = { pending: 'waiting for payment', awaiting_review: 'under review', paid: 'paid', rejected: 'rejected', expired: 'expired', cancelled: 'cancelled' };
  (async () => {
    if (!Shop.needClient($('who'))) return;
    const s = await Shop.session();
    if (!s) return location.replace('/login.html?next=/account');
    $('who').textContent = s.user.email; $('out').hidden = false;
    $('out').addEventListener('click', async () => { await sb.auth.signOut(); location.replace('/login.html'); });
    const { data, error } = await sb.from('orders').select('*').eq('user_id', s.user.id).order('created_at', { ascending: false });
    const box = $('list'); box.replaceChildren();
    if (error) return box.append(h('p', { class: 'msg err' }, error.message));
    if (!data.length) return box.append(h('p', { class: 'empty' }, 'No orders yet.'));
    data.forEach(o => box.append(h('div', { class: 'row' },
      h('div', {}, h('div', { class: 't' }, o.product_title, h('span', { class: 'pill' + (o.status === 'paid' ? ' ok' : o.status === 'rejected' ? ' bad' : '') }, TXT[o.status] || o.status)),
        h('div', { class: 'c' }, o.reference + ' | ' + Shop.dt(o.created_at))),
      h('div', { class: 't' }, fmt(o.amount_dzd)),
      h('div', { class: 'acts' }, h('a', { class: 'btn small', href: '/buy.html?o=' + encodeURIComponent(o.id) }, o.status === 'paid' ? 'View delivery' : o.status === 'pending' || o.status === 'awaiting_review' ? 'Continue' : 'Details')))));
  })().catch(e => { $('list').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
