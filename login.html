<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/pfp.png">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">
<title>Login | Resemblanced</title>
<meta name="robots" content="noindex">
</head>
<body>
<main class="wrap narrow">
  <nav id="nav"></nav>
  <h1 id="title">Login</h1>
  <p class="sub" id="sub">Welcome back</p>
  <div class="panel">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" minlength="6">
    <p style="margin-top:18px"><button class="btn" id="go">Login</button></p>
    <p class="msg" id="msg"></p>
    <p class="note"><a href="#" id="switch">New here? Create an account</a></p>
  </div>
  <div id="foot"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/theme.js"></script>
<script src="/shop.js"></script>
<script>if (typeof Shop === 'undefined') addEventListener('DOMContentLoaded', () => { const e = document.getElementById('state') || document.getElementById('list') || document.getElementById('msg'); if (e) e.textContent = 'Error: shop.js did not load. Upload shop.js next to index.html on GitHub.'; });</script>
<script>
  const $ = id => document.getElementById(id), { say } = Shop;
  let mode = 'in';
  const q = new URLSearchParams(location.search), nx = q.get('next');
  const dest = nx && /^\/[^\/\\]/.test(nx) ? nx : '/account';
  function setMode(m) {
    mode = m; $('title').textContent = m === 'in' ? 'Login' : 'Sign up'; $('sub').textContent = m === 'in' ? 'Welcome back' : 'Create your account';
    $('go').textContent = m === 'in' ? 'Login' : 'Create account';
    $('switch').textContent = m === 'in' ? 'New here? Create an account' : 'Already have an account? Login';
    $('pass').autocomplete = m === 'in' ? 'current-password' : 'new-password'; say($('msg'), '');
  }
  $('switch').addEventListener('click', e => { e.preventDefault(); setMode(mode === 'in' ? 'up' : 'in'); });
  async function go() {
    if (!Shop.needClient($('msg'))) return;
    const email = $('email').value.trim(), password = $('pass').value;
    if (!email || password.length < 6) return say($('msg'), 'Enter your email and a password (6+ characters).', 'err');
    $('go').disabled = true; say($('msg'), '...');
    const r = mode === 'in' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
    $('go').disabled = false;
    if (r.error) return say($('msg'), r.error.message, 'err');
    if (r.data.session) return location.replace(dest);
    say($('msg'), 'Account created. Check your email to confirm it, then login.', 'ok');
  }
  $('go').addEventListener('click', go);
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  Shop.session().then(s => { if (s) location.replace(dest); });
</script>
</body>
</html>
