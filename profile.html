<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>My profile | Resemblance</title>
<link rel="icon" href="/pfp.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">
<style>h1 { font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; text-shadow:none; }</style>
</head>
<body>
<main class="wrap narrow">
  <nav id="nav"></nav>
  <h1>My profile</h1>
  <p class="sub" id="sub"></p>
  <p id="state" class="empty">Loading...</p>
  <div id="view" hidden>
    <div class="panel">
      <div style="text-align:center" id="prev"></div>

      <label>Avatar</label>
      <div class="emojis" id="emojis"></div>
      <label>Color</label>
      <div class="swatches" id="swatches"></div>

      <label for="dname">Display name (optional)</label>
      <input id="dname" type="text" maxlength="30">
      <label for="uname">Username</label>
      <input id="uname" type="text" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="note" style="margin-top:8px">3-20 letters, numbers or _ . Your public page: <span id="link"></span></p>
      <label for="bio">Bio (optional, 200 characters)</label>
      <textarea id="bio" maxlength="200"></textarea>
      <label for="country">Country (optional)</label>
      <select id="country"></select>
      <div class="row2">
        <div><label for="ig">Instagram (optional)</label><input id="ig" type="text" maxlength="31" placeholder="username" autocapitalize="off"></div>
        <div><label for="tt">TikTok (optional)</label><input id="tt" type="text" maxlength="31" placeholder="username" autocapitalize="off"></div>
      </div>
      <p style="margin-top:16px" class="inline"><button class="btn" id="save">Save</button><a class="btn" id="open" href="#" hidden>View my page</a></p>
      <p class="msg" id="msg"></p>
    </div>
    <p style="text-align:center;margin-top:18px"><a class="btn small" href="/account">My orders</a> <button class="btn small" id="out">Logout</button></p>
  </div>
  <div id="foot"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/theme.js"></script>
<script src="/shop.js"></script>
<script>if (typeof Shop === 'undefined') addEventListener('DOMContentLoaded', () => { const e = document.getElementById('state'); if (e) e.textContent = 'Error: shop.js did not load. Upload shop.js next to index.html on GitHub.'; });</script>
<script>
  const $ = id => document.getElementById(id), { h, say } = Shop;
  const EMOJIS = ['', '🦊', '🐺', '🦅', '🐉', '🔥', '⚡', '🌙', '💎', '🎮', '🎧', '👑', '🖤', '🐱', '🚀', '🌟', '🍀'];
  const HUES = [null, 0, 25, 45, 140, 185, 215, 265, 320];
  const COUNTRIES = ['', 'Algeria', 'Morocco', 'Tunisia', 'Libya', 'Egypt', 'Saudi Arabia', 'United Arab Emirates', 'Qatar', 'Kuwait', 'France', 'Other'];
  const HANDLE = /^[A-Za-z0-9._]{1,30}$/;
  let uid = null, has = false, emoji = '', hue = null;

  const name = () => Shop.cleanUsername($('uname').value);
  function paint() {
    $('prev').replaceChildren(Shop.avatar({ username: name() || 'u', avatar_emoji: emoji || null, avatar_hue: hue }, 84));
    [...$('emojis').children].forEach(b => b.classList.toggle('on', b.dataset.e === emoji));
    [...$('swatches').children].forEach(b => b.classList.toggle('on', String(b.dataset.h) === String(hue)));
  }
  function showLink() { const n = name(); $('link').textContent = n ? 'rassim.shop/' + n : '(choose a username first)'; $('open').hidden = !(has && n); if (n) $('open').href = '/' + n; paint(); }

  $('emojis').replaceChildren(...EMOJIS.map(e => h('button', { type: 'button', 'data-e': e, 'aria-label': e || 'Use my initial', onclick: () => { emoji = e; paint(); } }, e || 'A')));
  $('swatches').replaceChildren(...HUES.map(v => h('button', { type: 'button', 'data-h': String(v), 'aria-label': v === null ? 'Theme color' : 'Color', style: 'background:' + (v === null ? 'var(--accent)' : `hsl(${v} 70% 58%)`), onclick: () => { hue = v; paint(); } })));
  $('country').replaceChildren(...COUNTRIES.map(c => h('option', { value: c }, c || 'Not set')));
  $('uname').addEventListener('input', showLink);

  $('save').addEventListener('click', async () => {
    const n = name(), clean = id => $(id).value.trim().replace(/^@/, '') || null;
    if (!Shop.validUsername(n)) return say($('msg'), 'Use 3-20 letters, numbers or _ for the username (some names are reserved).', 'err');
    const ig = clean('ig'), tt = clean('tt');
    if ((ig && !HANDLE.test(ig)) || (tt && !HANDLE.test(tt))) return say($('msg'), 'Instagram/TikTok: letters, numbers, . or _ only.', 'err');
    const row = { username: n, bio: $('bio').value.trim() || null, display_name: $('dname').value.trim() || null, country: $('country').value || null, instagram: ig, tiktok: tt, avatar_emoji: emoji || null, avatar_hue: hue };
    $('save').disabled = true; say($('msg'), '...');
    const r = has ? await sb.from('profiles').update(row).eq('id', uid) : await sb.from('profiles').insert({ id: uid, ...row });
    $('save').disabled = false;
    if (r.error) return say($('msg'), /duplicate|unique/i.test(r.error.message) ? 'This username is already taken.' : r.error.message, 'err');
    has = true; showLink(); say($('msg'), 'Saved. Your page: rassim.shop/' + n, 'ok');
  });
  $('out').addEventListener('click', async () => { await sb.auth.signOut(); location.replace('/login.html'); });

  (async () => {
    if (!Shop.needClient($('state'))) return;
    const s = await Shop.session();
    if (!s) return location.replace('/login.html?next=/profile');
    uid = s.user.id; $('sub').textContent = s.user.email;
    const { data } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
    if (data) {
      has = true; $('uname').value = data.username; $('bio').value = data.bio || ''; $('dname').value = data.display_name || '';
      $('country').value = data.country || ''; $('ig').value = data.instagram || ''; $('tt').value = data.tiktok || '';
      emoji = data.avatar_emoji || ''; hue = data.avatar_hue === null || data.avatar_hue === undefined ? null : Number(data.avatar_hue);
    }
    showLink(); $('state').hidden = true; $('view').hidden = false;
  })().catch(e => { $('state').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
